<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whiteboard · Markov.ink</title>
<meta name="description" content="Work through a problem on the board with your Markov.ink tutor.">
<meta name="theme-color" content="#F6FAFD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="learn-assets/learn.css">
<link rel="stylesheet" href="learn-assets/board.css">
</head>
<body class="mk bb">
<a class="skip" href="#dock">Skip to tutor controls</a>

<header class="bb-top">
  <a class="bb-back" id="back" href="learn" aria-label="Back"></a>
  <div class="bb-q-nav">
    <button type="button" class="bb-icon" id="q-prev" aria-label="Previous question"></button>
    <span class="bb-q-count" id="q-count">Free practice</span>
    <span class="bb-dots" id="q-dots" role="group" aria-label="Questions in this set" hidden></span>
    <button type="button" class="bb-icon" id="q-next" aria-label="Next question"></button>
  </div>
  <span class="bb-spacer"></span>
  <span class="bb-status" id="status" role="status" aria-live="polite"><i></i><span>Getting ready</span></span>
  <button type="button" class="bb-finish-btn" id="finish-btn" hidden>Finish</button>
  <div class="bb-menu-wrap">
    <button type="button" class="bb-icon" id="menu-btn" aria-label="Board menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu"></button>
    <div class="bb-pop bb-menu" id="menu" role="menu" hidden></div>
  </div>
</header>

<main class="bb-stage" id="stage">
  <canvas id="ink" class="bb-ink" role="img" aria-label="Your work on the board. Use Type instead in the conversation to write without drawing."></canvas>
  <svg id="tutor-layer" class="bb-tutor-layer" aria-hidden="true"></svg>
  <div id="widgets" class="bw-layer"></div>
  <div id="steps-layer" class="bb-steps"></div>
  <div id="sel-box" class="bb-sel" hidden><button type="button" class="bb-chip small" id="sel-del"></button></div>
  <div id="ask-chip" class="bb-ask" hidden></div>
  <div class="bb-pop bb-step-pop" id="step-pop" role="menu" aria-label="Ask about this line" hidden></div>
  <div id="replay-bar" class="bb-replay" role="group" aria-label="Replay controls" hidden></div>
  <div id="spot" class="bb-spot" hidden></div>
  <div id="cursor" class="bb-cursor" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 3l7 17 2.5-7L21 10.5Z" fill="currentColor"/></svg><span>Tutor</span></div>

  <section class="bb-question" id="question" aria-label="Question"></section>

  <nav class="bb-tools" id="tools" aria-label="Your tools"></nav>
  <div class="bb-pop bb-tool-pop" id="tool-pop" hidden></div>
  <div class="bb-textbox" id="textbox" hidden>
    <label class="sr-only" for="text-in">Text to place on the board</label>
    <input id="text-in" type="text" autocomplete="off" spellcheck="false" placeholder="Type, then press Enter">
    <div class="bb-syms" id="syms"></div>
  </div>

  <section class="bb-dock" id="dock" aria-label="Tutor">
    <div class="bb-sub" id="sub" aria-live="polite"></div>
    <div class="bb-actions" id="actions"></div>
    <div class="bb-focus" id="focus-card" hidden></div>
  </section>

  <aside class="bb-chat" id="chat" aria-label="Conversation with your tutor" hidden>
    <div class="bb-chat-head"><h2>Conversation</h2><button type="button" class="bb-icon" id="chat-close" aria-label="Close conversation"></button></div>
    <ol class="bb-chat-log" id="chat-log"></ol>
    <form class="bb-chat-form" id="chat-form">
      <label class="sr-only" for="chat-in">Type to your tutor</label>
      <input id="chat-in" type="text" autocomplete="off" placeholder="Type to your tutor">
      <button type="submit" class="bb-send" aria-label="Send"></button>
    </form>
  </aside>
</main>

<dialog class="bb-dialog" id="finish-dlg" aria-labelledby="fin-title"></dialog>

<noscript><p class="bb-nojs">The board needs JavaScript. <a href="learn">Go back to your courses</a>.</p></noscript>

<script src="learn-assets/profile.js"></script>
<script src="learn-assets/ui.js"></script>
<script src="learn-assets/course-data.js"></script>
<script src="learn-assets/learning.js"></script>
<script src="learn-assets/problems.js"></script>
<script src="learn-assets/board-tutor.js"></script>
<script src="learn-assets/board-widgets.js"></script>
<script src="learn-assets/board.js"></script>
</body>
</html>
